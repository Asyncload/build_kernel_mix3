name: build - mix3 - kernel

on:
  push:
    branches:
      - main

jobs:
  build_kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential curl flex git libncurses5-dev libssl-dev make python3 wget zip patch

      - name: Checkout kernel source
        uses: actions/checkout@v2
        with:
          repository: LineageOS/android_kernel_xiaomi_sdm845
          ref: lineage-21
          path: kernel

      # 下载并解压 Clang 13.0.0 (使用官方预编译版本)
      - name: Download Clang 13.0.0
        run: |
          wget https://github.com/llvm/llvm-project/releases/download/llvmorg-13.0.0/clang+llvm-13.0.0-x86_64-linux-gnu-ubuntu-20.04.tar.xz
          tar -xf clang+llvm-13.0.0-x86_64-linux-gnu-ubuntu-20.04.tar.xz
          mv clang+llvm-13.0.0-x86_64-linux-gnu-ubuntu-20.04 clang-13

      # 设置环境变量：PATH, ARCH, CROSS_COMPILE, LLVM
      - name: Set environment for Clang
        run: |
          export PATH=$PWD/clang-13/bin:$PATH
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export LLVM=1
          # 可选：指定 cc 和 ld (通常 LLVM=1 足够)
          export CC=clang
          export LD=ld.lld
          # 将变量写入 GITHUB_ENV 以便后续步骤使用
          echo "PATH=$PATH" >> $GITHUB_ENV
          echo "ARCH=$ARCH" >> $GITHUB_ENV
          echo "CROSS_COMPILE=$CROSS_COMPILE" >> $GITHUB_ENV
          echo "LLVM=1" >> $GITHUB_ENV
          echo "CC=clang" >> $GITHUB_ENV
          echo "LD=ld.lld" >> $GITHUB_ENV

      - name: Configure kernel
        working-directory: kernel
        run: |
          cp arch/arm64/configs/sdm845_defconfig .config
          cat arch/arm64/configs/vendor/xiaomi/perseus.config >> .config
          make ARCH=arm64 olddefconfig
          make scripts
          make prepare

      - name: Build kernel
        working-directory: kernel
        run: make -j6 KCFLAGS="-Wno-error"

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mix3-Clang13-Kernel
          path: kernel/arch/arm64/boot/Image.gz

