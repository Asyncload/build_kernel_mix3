name: Build Mix3 KernelSU

on:
  push:
    branches: [ main, ci ]
  # 允许手动触发
  workflow_dispatch:

jobs:
  build_kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential curl flex git libncurses5-dev libssl-dev \
                                 make python3 wget zip patch binutils-aarch64-linux-gun

      - name: Checkout kernel source
        uses: actions/checkout@v2
        with:
          repository: LineageOS/android_kernel_xiaomi_sdm845
          ref: lineage-21
          path: kernel

      # ============================================================
      # 补丁与 KernelSU 集成
      # ============================================================
      - name: Apply kernel patches & integrate KernelSU v0.9.5
        working-directory: kernel
        run: |
          # 1. 集成 KernelSU v0.9.5
          echo "==> 集成 KernelSU v0.9.5 ..."
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s v0.9.5

          # 2. 启用 KernelSU 所需的内核配置
          echo "==> 启用 KernelSU 和 kprobe 配置选项 ..."
          DEFCONFIG_PATH="arch/arm64/configs/sdm845_defconfig"
          if [ -f "$DEFCONFIG_PATH" ]; then
            sed -i 's/^# CONFIG_KSU is not set$/CONFIG_KSU=y/' $DEFCONFIG_PATH || echo "CONFIG_KSU=y" >> $DEFCONFIG_PATH
            grep -q "CONFIG_KSU=y" $DEFCONFIG_PATH || echo "CONFIG_KSU=y" >> $DEFCONFIG_PATH
            # kprobe 相关配置
            sed -i 's/^CONFIG_KPROBES=.*$/CONFIG_KPROBES=y/' $DEFCONFIG_PATH || echo "CONFIG_KPROBES=y" >> $DEFCONFIG_PATH
            sed -i 's/^CONFIG_HAVE_KPROBES=.*$/CONFIG_HAVE_KPROBES=y/' $DEFCONFIG_PATH || echo "CONFIG_HAVE_KPROBES=y" >> $DEFCONFIG_PATH
            sed -i 's/^CONFIG_KPROBE_EVENTS=.*$/CONFIG_KPROBE_EVENTS=y/' $DEFCONFIG_PATH || echo "CONFIG_KPROBE_EVENTS=y" >> $DEFCONFIG_PATH
          else
            echo "警告: 未找到 defconfig 文件 $DEFCONFIG_PATH"
          fi

          # 3. 您原有的所有补丁命令 (下面只是示例，请替换为您自己的)
          echo "==> 应用其他内核补丁 ..."
          sed -i 's|#define TRACE_INCLUDE_PATH .|#define TRACE_INCLUDE_PATH ../../drivers/soc/qcom|' drivers/soc/qcom/tracer_pkt_private.h
          sed -i 's|#include <function/u_ncm.h>|#include "function/u_ncm.h"|' drivers/usb/gadget/configfs.c
          sed -i 's/#include <idtp9220.h>/#include "idtp9220.h"/' drivers/power/supply/qcom/idtp9220.c
          # ... (在此处继续添加您之前所有成功的 sed 命令) ...

          # 删除不兼容的 elliptic 模块
          rm -rf techpack/audio/asoc/elliptic techpack/audio/asoc/elliptic_common 2>/dev/null || true
          sed -i '/elliptic/d' techpack/audio/asoc/Makefile 2>/dev/null || true

      - name: Download Clang 13.0.0
        run: |
          wget https://github.com/llvm/llvm-project/releases/download/llvmorg-13.0.0/clang+llvm-13.0.0-x86_64-linux-gnu-ubuntu-20.04.tar.xz
          tar -xf clang+llvm-13.0.0-x86_64-linux-gnu-ubuntu-20.04.tar.xz
          mv clang+llvm-13.0.0-x86_64-linux-gnu-ubuntu-20.04 clang-13

      - name: Set environment for Clang
        run: |
          export PATH=$PWD/clang-13/bin:$PATH
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export LLVM=1
          echo "PATH=$PATH" >> $GITHUB_ENV
          echo "ARCH=$ARCH" >> $GITHUB_ENV
          echo "CROSS_COMPILE=$CROSS_COMPILE" >> $GITHUB_ENV
          echo "LLVM=1" >> $GITHUB_ENV

      # ============================================================
      # 配置与编译
      # ============================================================
      - name: Configure kernel
        working-directory: kernel
        run: |
          cp arch/arm64/configs/sdm845_defconfig .config
          cat arch/arm64/configs/vendor/xiaomi/perseus.config >> .config
          # ========== 禁用不必要的模块 ==========
          scripts/config --disable CONFIG_EFI \
                         --disable CONFIG_EFI_STUB \
                         --disable CONFIG_EFI_DEV_PATH_PARSER \
                         --disable CONFIG_HALL \
                         --disable CONFIG_HALL_SENSOR \
                         --disable CONFIG_ELLIPTIC \
                         --disable CONFIG_ELLIPTIC_SUPPORT \
                         --disable CONFIG_MSM_ULTRASOUND \
                         --disable CONFIG_SND_SOC_MSM_ULTRA \
                         --disable CONFIG_AFE_LOOPBACK
          make ARCH=arm64 olddefconfig
          make scripts
          make prepare

      - name: Build kernel
        working-directory: kernel
        run: make -j$(nproc) KCFLAGS="-Wno-error"

      # ============================================================
      # AnyKernel3 打包（社区方案）
      # ============================================================
      - name: Prepare AnyKernel3 environment
        run: |
          git clone https://github.com/osm0sis/AnyKernel3 -b master
          cd AnyKernel3
          # 移除默认的 .git 目录，以防后续打包被污染
          rm -rf .git

      - name: Setup AnyKernel3 for Xiaomi Mi Mix 3
        run: |
          cd AnyKernel3
          cat > anykernel.sh << 'EOF'
          # AnyKernel3 Ramdisk Mod Script
          # osm0sis @ xda-developers

          ## 基本设置
          kernel.string=Mix3-KernelSU by Github Action @ xda-developers
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=perseus
          device.name2=mi_mix3
          device.name3=xiaomi
          supported.versions=9 - 14
          patch_vbmeta_flag=auto

          ## 分区与插槽设置
          block=boot;
          is_slot_device=auto;
          ramdisk_compression=auto;

          ## 刷机流程
          . tools/ak3-core.sh;
          split_boot;
          flash_boot;
          ## 末尾
          EOF

          # 删除可能存在的示例文件或目录
          rm -f Image* zImage* *dtb* kernel* ramdisk.patch 2>/dev/null || true
          rm -rf ramdisk patch 2>/dev/null || true

      - name: Copy kernel image to AnyKernel3 folder
        run: |
          # 假设内核编译产物路径为 kernel/arch/arm64/boot/Image.gz-dtb
          KERNEL_IMAGE="kernel/arch/arm64/boot/Image.gz-dtb"
          # 有些内核只有 Image.gz，或者两者都是，优先使用带 dtb 的
          if [ ! -f "$KERNEL_IMAGE" ]; then
            KERNEL_IMAGE="kernel/arch/arm64/boot/Image.gz"
          fi
          cp "$KERNEL_IMAGE" AnyKernel3/

      - name: Create flashable ZIP
        run: |
          cd AnyKernel3
          zip -r9 Mix3-KernelSU-$(date +%Y%m%d-%H%M%S).zip . -x ".git*" "*~" "*.sh.*" "*.txt"
          mv *.zip ..? # 将生成的 zip 包移动到上一级目录（方便上传）

      - name: Upload kernel artifact (Image)
        uses: actions/upload-artifact@v4
        with:
          name: Mix3-KernelImage
          path: kernel/arch/arm64/boot/Image.gz*

      - name: Upload AnyKernel3 flashable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Mix3-KernelSU-AnyKernel3.zip
          path: AnyKernel3/*.zip
