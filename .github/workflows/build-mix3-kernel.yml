name: build - mix3 - kernel

on:
  push:
    branches:
      - main

jobs:
  build_kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential curl flex git libncurses5-dev libssl-dev make python3 wget zip patch

      - name: Checkout kernel source
        uses: actions/checkout@v2
        with:
          repository: LineageOS/android_kernel_xiaomi_sdm845
          ref: lineage-21
          path: kernel

      - name: Apply kernel patches
        working-directory: kernel
        run: |
          # 蓝牙修复
          sed -i 's/#include <btfm_slim.h>/#include "btfm_slim.h"/' drivers/bluetooth/btfm_slim.c
          sed -i 's/#include <btfm_slim_wcn3990.h>/#include "btfm_slim_wcn3990.h"/' drivers/bluetooth/btfm_slim_wcn3990.c

          # trace 路径修复
          sed -i 's|#define TRACE_INCLUDE_PATH .|#define TRACE_INCLUDE_PATH ../../drivers/clk/qcom/mdss|' drivers/clk/qcom/mdss/mdss_pll_trace.h
          sed -i 's|#define TRACE_INCLUDE_PATH .|#define TRACE_INCLUDE_PATH ../../drivers/gpu/msm|' drivers/gpu/msm/kgsl_trace.h
          sed -i 's|#define TRACE_INCLUDE_PATH .|#define TRACE_INCLUDE_PATH ../../drivers/gpu/msm|' drivers/gpu/msm/adreno_trace.h

          # kgsl_device 包含
          sed -i 's/#include <kgsl_device.h>/#include "kgsl_device.h"/' drivers/gpu/msm/kgsl_events.c

          # 相机驱动：批量将尖括号包含改为双引号
          find drivers/media/platform/msm/camera -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i 's/#include <cam_/#include "cam_/g' {} \;

          # cam_isp_packet_parser.h 修复
          sed -i 's|#include "cam_ife_hw_mgr.h"|#include "../../cam_ife_hw_mgr.h"|' \
            drivers/media/platform/msm/camera/cam_isp/isp_hw_mgr/hw_utils/include/cam_isp_packet_parser.h

          # 用仓库中的补丁文件覆盖 cam_trace.h
          cp ../.github/patches/cam_trace.h drivers/media/platform/msm/camera/cam_utils/cam_trace.h

      - name: Fix sdcardfs compile error
        working-directory: kernel
        run: sed -i '469s/^pr_info/\/\//' fs/sdcardfs/main.c

      - name: Download & extract GCC 5.1 (Linaro official)
        run: |
          wget https://releases-ie.linaro.org/components/toolchain/binaries/5.1-2015.08/aarch64-linux-gnu/gcc-linaro-5.1-2015.08-x86_64_aarch64-linux-gnu.tar.xz
          tar -xf gcc-linaro-5.1-2015.08-x86_64_aarch64-linux-gnu.tar.xz
          mv gcc-linaro-5.1-2015.08-x86_64_aarch64-linux-gnu gcc-5.1

      - name: Set env with GCC5.1
        run: |
          export PATH=$PWD/gcc-5.1/bin:$PATH
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          echo "PATH=$PATH" >> $GITHUB_ENV
          echo "ARCH=$ARCH" >> $GITHUB_ENV
          echo "CROSS_COMPILE=$CROSS_COMPILE" >> $GITHUB_ENV

      - name: Configure kernel
        working-directory: kernel
        run: |
          cp arch/arm64/configs/sdm845_defconfig .config
          cat arch/arm64/configs/vendor/xiaomi/perseus.config >> .config
          make ARCH=arm64 olddefconfig
          make scripts
          make prepare

      - name: Build kernel
        working-directory: kernel
        run: make -j$(nproc)

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mix3-GCC5.1-Kernel
          path: kernel/arch/arm64/boot/Image.gz
