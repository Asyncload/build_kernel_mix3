name: build - mix3 - kernel

on:
  push:
    branches:
      - main

jobs:
  build_kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential curl flex git libncurses5-dev libssl-dev make python3 wget zip patch

      - name: Checkout kernel source
        uses: actions/checkout@v2
        with:
          repository: LineageOS/android_kernel_xiaomi_sdm845
          ref: lineage-21
          path: kernel

      # 补丁2：注释 sdcardfs 报错打印行
      - name: Patch 1 — Fix sdcardfs compile error
        run: |
          cd kernel
          sed -i '469s/^pr_info/\/\//' fs/sdcardfs/main.c
      # 补丁3：修复.h文件路径  
      - name: Fix all trace include paths in drivers
        run: |
          cd kernel
          #修复 mdss_pll_trace.h
          sed -i 's|#define TRACE_INCLUDE_PATH .|#define TRACE_INCLUDE_PATH ../../drivers/clk/qcom/mdss|' drivers/clk/qcom/mdss/mdss_pll_trace.h
          #修复 kgsl_trace.h
          sed -i 's|#define TRACE_INCLUDE_PATH .|#define TRACE_INCLUDE_PATH ../../drivers/gpu/msm|' drivers/gpu/msm/kgsl_trace.h
          #修复 kgsl_events.c
          sed -i 's/#include <kgsl_device.h>/#include "kgsl_device.h"/' drivers/gpu/msm/kgsl_events.c
          

      # 补丁3：蓝牙模块，规避通配符报错
      - name: Patch 2 — Global fix all btfm_slim local headers
        run: |
          cd kernel/drivers/bluetooth
          find . -maxdepth 1 -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i 's/<\(btfm_slim.*\.h\)>/"\1"/g' {} \;
          

      # 下载你指定的 Linaro GCC 5.1
      - name: Download & extract GCC 5.1 (Linaro official)
        run: |
          wget https://releases-ie.linaro.org/components/toolchain/binaries/5.1-2015.08/aarch64-linux-gnu/gcc-linaro-5.1-2015.08-x86_64_aarch64-linux-gnu.tar.xz
          tar -xf gcc-linaro-5.1-2015.08-x86_64_aarch64-linux-gnu.tar.xz
          mv gcc-linaro-5.1-2015.08-x86_64_aarch64-linux-gnu gcc-5.1

      - name: Set env with GCC5.1
        run: |
          export PATH=$PWD/gcc-5.1/bin:$PATH
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          echo "PATH=$PATH" >> $GITHUB_ENV
          echo "ARCH=$ARCH" >> $GITHUB_ENV
          echo "CROSS_COMPILE=$CROSS_COMPILE" >> $GITHUB_ENV

      - name: Configure kernel
        run: |
          cd kernel
          make olddefconfig
          make scripts
          make prepare
          cp arch/arm64/configs/sdm845_defconfig .config
          cat arch/arm64/configs/vendor/xiaomi/perseus.config >> .config
          make ARCH=arm64 olddefconfig
          

      - name: Build kernel
        run: |
          cd kernel
          make -j$(nproc)

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mix3-GCC5.1-Kernel
          path: kernel/arch/arm64/boot/Image.gz
